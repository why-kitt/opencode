name: Build patched Windows x64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "OpenCode stable release tag (empty = latest; validated: v1.18.34)"
        required: false
        default: ""
      publish_release:
        description: "Publish a private repository release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-windows-x64
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve stable release
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:INPUT_TAG
          if (-not $tag) {
            $tag = gh api repos/anomalyco/opencode/releases/latest --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve latest release' }
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Expected stable release tag, got: $tag" }
          $revision = (Get-Content build.json -Raw | ConvertFrom-Json).patch_revision
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))-patched.$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: ${{ steps.resolve.outputs.tag }}
          path: opencode-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and apply patches
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_patches.py --root opencode-src --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply_patches.py --root opencode-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve Bun version
        id: bun
        shell: pwsh
        run: |
          $version = (Get-Content build.json -Raw | ConvertFrom-Json).bun_version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.bun.outputs.version }}-${{ hashFiles('opencode-src/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ steps.bun.outputs.version }}-
      - name: Install locked dependencies
        working-directory: opencode-src
        run: bun install --frozen-lockfile
      - name: Check types and retry behavior
        working-directory: opencode-src/packages/opencode
        shell: pwsh
        run: |
          bun typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test test/tool/task.test.ts test/session/reconnect.test.ts test/session/reconnect-worker.test.ts test/session/retry.test.ts --timeout 60000 --only-failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check background config precedence
        working-directory: opencode-src/packages/opencode
        run: bun test test/config/config.test.ts --test-name-pattern "subagent background default" --timeout 60000
      - name: Check TUI
        working-directory: opencode-src/packages/tui
        shell: pwsh
        run: |
          bun typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test test/reconnect.test.ts test/clipboard.test.ts --timeout 30000 --only-failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CLI with embedded Web UI
        working-directory: opencode-src/packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.resolve.outputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_RELEASE: ""
        run: bun run script/build.ts --single --skip-install
      - name: Check Windows process handling
        working-directory: opencode-src/packages/core
        run: bun test test/effect/cross-spawn-spawner.test.ts --timeout 30000 --only-failures
      - name: Test compiled CLI with local mock provider
        run: bun scripts/smoke.ts opencode-src/packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
      - name: Test Windows smoke cleanup
        run: bun test scripts/smoke-cleanup.test.ts --timeout 15000
      - name: Test compiled background callbacks and reassignment
        run: bun scripts/background-smoke.ts opencode-src/packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
      - name: Test live TUI reconnect controls
        run: node scripts/tui-smoke.cjs opencode-src
      - name: Package and record source diff
        shell: pwsh
        env:
          BUILD_TAG: ${{ steps.resolve.outputs.tag }}
          BUILD_VERSION: ${{ steps.resolve.outputs.version }}
        run: python scripts/package.py --root opencode-src --tag "$env:BUILD_TAG" --version "$env:BUILD_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
      - name: Publish private release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          $release = "patched-$env:BUILD_VERSION"
          gh release view $release *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $release --title "OpenCode $env:BUILD_VERSION Windows x64" --notes-file RUNNING.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release upload $release @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
